<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HyperFrames Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark"></span>HyperFrames Live</div>
    <div id="file" class="file"></div>
    <div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
    <div class="spacer"></div>
    <button id="replay" title="Play the build again from an empty canvas">Replay build</button>
  </header>
  <main>
    <section id="viewport">
      <div id="stage">
        <iframe id="frameA" class="front" title="Composition"></iframe>
        <iframe id="frameB" title="Composition (next version)"></iframe>
        <div id="empty">Waiting for the agent to write the composition…</div>
      </div>
      <div id="size"></div>
    </section>
    <aside id="activity">
      <h3>Activity</h3>
      <ol id="feed"></ol>
    </aside>
  </main>
  <footer id="timeline">
    <div class="controls">
      <button id="play" title="Play / pause (Space)">▶</button>
      <span id="time">0.00s / 0.00s</span>
    </div>
    <div id="tracks">
      <div id="ruler"></div>
      <div id="rows"></div>
      <div id="playhead"></div>
    </div>
  </footer>
  <div id="overlay">
    <div id="selection"><span></span></div>
    <div id="cursor">
      <div class="pointer">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <defs>
            <linearGradient id="cursorFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a48bff"/><stop offset="1" stop-color="#6a3dff"/>
            </linearGradient>
          </defs>
          <path d="M4.6 3.4c-.6-.3-1.3.2-1.2.9l2.6 19.2c.1.8 1.1 1 1.6.4l4.6-5.6 7.2-.6c.8-.1 1.1-1 .5-1.6L4.6 3.4z"
                fill="url(#cursorFill)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="tag">
        <span class="avatar"><svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 0c.5 4.2 3.8 7.5 8 8-4.2.5-7.5 3.8-8 8-.5-4.2-3.8-7.5-8-8 4.2-.5 7.5-3.8 8-8z" fill="#fff"/></svg></span>
        <b id="cursorName">Agent</b>
        <span class="what"><span id="cursorText"></span></span>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
